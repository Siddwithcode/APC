<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>

<h2>Student Registration Form</h2>

{% if message %}
<p style="color:green;">{{ message }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

    {% for field in form %}
        <p>
            {{ field.label }}<br>
            {{ field }}
            {% for error in field.errors %}
                <span style="color:red;">{{ error }}</span>
            {% endfor %}
        </p>
    {% endfor %}

    <button type="submit">Submit</button>
</form>

</body>
</html>
